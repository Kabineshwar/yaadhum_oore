<main>

<h2>Edit Tourism Package</h2><p>Update the selected package details.</p>
<form id="editPackageForm">
<input type="hidden" id="packageId">
<label for="name">Package Name</label><input id="name" required>
<label for="destination">Destination</label><input id="destination" required>
<label for="category">Category</label><select id="category" required><option>Adventure</option><option>Nature</option><option>Cultural</option><option>Beach</option><option>Pilgrimage</option></select>
<label for="price">Price Per Person (₹)</label><input type="number" id="price" min="1" step="0.01" required>
<label for="duration">Duration</label><input id="duration" required>
<label for="capacity">Available Seats</label><input type="number" id="capacity" min="1" required>
<label for="startDate">Start Date</label><input type="date" id="startDate" required>
<label for="endDate">End Date</label><input type="date" id="endDate" required>
<label for="description">Description</label><textarea id="description" rows="4"></textarea>
<label for="itinerary">Itinerary</label><textarea id="itinerary" rows="5"></textarea>
<button type="submit">Update Package</button><p id="message" class="message" aria-live="polite"></p>
</form>

</main>
<footer><p>YAADHUM OOORE | Explore Your World</p></footer>
<script src="js/provider.js"></script>
</body>
</html>
