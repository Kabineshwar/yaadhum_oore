
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Package - YAADHUM OOORE</title>
    <link rel="stylesheet" href="css/provider.css">
</head>
<body>

    <header>
        <h1>YAADHUM OOORE</h1>
        <p>Local Tourism Provider Portal</p>
    </header>

    <nav>
        <a href="provider-dashboard.html">Dashboard</a>
        <a href="my-packages.html">My Packages</a>
        <a href="add-package.html">Add Package</a>
        <a href="provider-bookings.html">Bookings</a>
    </nav>

    <main>
        <h2>Edit Tourism Package</h2>
        <p>Update the details of your tourism package.</p>

        <form>

            <label for="name">Package Name</label>
            <input type="text" id="name" value="Ooty Weekend Trip" required>

            <label for="destination">Destination</label>
            <input type="text" id="destination" value="Ooty" required>

            <label for="category">Category</label>
            <select id="category">
                <option value="nature">Nature</option>
                <option value="adventure">Adventure</option>
                <option value="cultural">Cultural</option>
                <option value="beach">Beach</option>
                <option value="pilgrimage">Pilgrimage</option>
            </select>

            <label for="price">Price Per Person (₹)</label>
            <input type="number" id="price" value="2500" required>

            <label for="duration">Duration</label>
            <input type="text" id="duration" value="2 days, 1 night" required>

            <label for="seats">Available Seats</label>
            <input type="number" id="seats" value="10" required>

            <label for="description">Description</label>
            <textarea id="description" rows="4">Enjoy a beautiful weekend trip to Ooty.</textarea>

            <label for="itinerary">Itinerary</label>
            <textarea id="itinerary" rows="4">Day 1: Arrival and sightseeing.
Day 2: Visit tourist attractions and return.</textarea>

            <button type="submit">Update Package</button>

        </form>

        <p class="note">
            Package updates will be connected to the database later.
        </p>
    </main>

    <footer>
        <p>YAADHUM OOORE | Explore Your World</p>
    </footer>

</body>
</html>
