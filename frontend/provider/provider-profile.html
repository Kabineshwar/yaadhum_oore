<main>

<h2>My Provider Profile</h2><p>Update your personal and business details.</p>
<form id="profileForm">
<label for="providerName">Provider Name</label><input id="providerName" required>
<label for="email">Email Address</label><input type="email" id="email" required>
<label for="phone">Phone Number</label><input type="tel" id="phone" required>
<label for="business">Business Name</label><input id="business" required>
<label for="location">Business Location</label><input id="location" required>
<label for="description">About Your Business</label><textarea id="description" rows="4"></textarea>
<button type="submit">Save Profile</button><p id="message" class="message" aria-live="polite"></p>
</form>

</main>
