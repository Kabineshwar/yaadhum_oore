<main>

<h2>My Provider Profile</h2>
<p>Update your personal and business credentials. These details are visible to travelers booking your packages.</p>

<form id="profileForm">
  <label for="providerName">Authorized Contact Name *</label>
  <input id="providerName" required>

  <label for="email">Official Email Address *</label>
  <input type="email" id="email" required>

  <label for="phone">Phone / WhatsApp Number *</label>
  <input type="tel" id="phone" required>

  <label for="business">Agency / Business Name *</label>
  <input id="business" required placeholder="e.g. Mountain Adventures">

  <label for="location">Operating Region / City *</label>
  <input id="location" required placeholder="e.g. Ooty, Nilgiris, Tamil Nadu">

  <label for="description">About Your Experience & Services</label>
  <textarea id="description" rows="4" placeholder="Share your experience, licenses, languages spoken, and guiding philosophy..."></textarea>

  <button type="submit">Save Profile Changes</button>
  <p id="message" class="message" aria-live="polite"></p>
</form>

</main>
