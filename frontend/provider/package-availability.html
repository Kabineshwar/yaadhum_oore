<main>

<h2>Manage Package Availability & Dates</h2>
<p>Set active season dates and seat capacities for your listed packages.</p>

<form id="availabilityForm">
  <label for="package">Choose Package *</label>
  <select id="package" required>
    <!-- Options populated by provider.js -->
  </select>

  <label for="start">Start Date *</label>
  <input type="date" id="start" required>

  <label for="end">End Date *</label>
  <input type="date" id="end" required>

  <label for="seats">Available Seats *</label>
  <input type="number" id="seats" min="1" max="100" required placeholder="e.g. 15">

  <button type="submit">Update Availability</button>
  <p id="message" class="message" aria-live="polite"></p>
</form>

</main>
