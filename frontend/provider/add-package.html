
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Package - YAADHUM OOORE</title>
    <link rel="stylesheet" href="css/provider.css">
</head>
<body>

    <header>
        <h1>YAADHUM OOORE</h1>
        <p>Local Tourism Provider Portal</p>
    </header>

    <nav>
        <a href="provider-dashboard.html">Dashboard</a>
        <a href="add-package.html">Add Package</a>
    </nav>

    <main>
        <h2>Add New Tourism Package</h2>
        <p>Enter the details of the tour you want to offer.</p>

        <form id="packageForm">

            <label for="name">Package Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Example: Ooty Weekend Trip" required>

            <label for="destination">Destination</label>
            <input type="text" id="destination" name="destination"
                   placeholder="Example: Ooty" required>

            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select category</option>
                <option value="adventure">Adventure</option>
                <option value="nature">Nature</option>
                <option value="cultural">Cultural</option>
                <option value="beach">Beach</option>
                <option value="pilgrimage">Pilgrimage</option>
            </select>

            <label for="price">Price Per Person (₹)</label>
            <input type="number" id="price" name="price"
                   min="1" step="0.01" required>

            <label for="duration">Duration</label>
            <input type="text" id="duration" name="duration"
                   placeholder="Example: 2 days, 1 night" required>

            <label for="capacity">Available Seats</label>
            <input type="number" id="capacity" name="capacity"
                   min="1" required>

            <label for="startDate">Start Date</label>
            <input type="date" id="startDate" name="startDate" required>

            <label for="endDate">End Date</label>
            <input type="date" id="endDate" name="endDate" required>

            <label for="description">Package Description</label>
            <textarea id="description" name="description" rows="4"
                      placeholder="Describe the tour..." required></textarea>

            <label for="itinerary">Day-wise Itinerary</label>
            <textarea id="itinerary" name="itinerary" rows="5"
                      placeholder="Day 1: Arrival and sightseeing..."
                      required></textarea>

            <button type="submit">Save Package</button>
            <p id="message" aria-live="polite"></p>
        </form>

        <p class="note">
            Note: This is the frontend form. Database saving will be
            implemented when the backend API is ready.
        </p>
    </main>

    <footer>
        <p>YAADHUM OOORE | Explore Your World</p>
    </footer>

    <script src="js/provider.js"></script>
</body>
</html>
